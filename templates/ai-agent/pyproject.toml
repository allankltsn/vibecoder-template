[project]
name = "ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agno>=1.3.0",
  "anthropic>=0.36.0",
  "langchain>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]
memory = [
  "redis>=5.0.0",
  "langchain-community>=0.3.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
