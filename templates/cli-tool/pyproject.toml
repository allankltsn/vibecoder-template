[project]
name = "mycli"
version = "0.1.0"
description = "Descrição da sua CLI"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.15.0",
  "rich>=13.0.0",
  "pydantic-settings>=2.6.0",
]

[project.scripts]
mycli = "mycli.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycli"]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "UP", "B"]
