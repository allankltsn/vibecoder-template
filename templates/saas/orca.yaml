version: "1"
agents:
  claude:
    provider: anthropic
    model: claude-opus-4-5
  codex:
    provider: openai
    model: codex-mini-latest

profiles:
  feature:
    agents: [claude, codex]
    strategy: parallel
    judge: claude
  landing:
    agents: [codex]
    strategy: sequential
  bugfix:
    agents: [claude]
    strategy: sequential

context:
  inject_files: [AGENTS.md, ".claude/CLAUDE.md"]
  inject_tree: true

output:
  format: diff
  auto_apply: false
